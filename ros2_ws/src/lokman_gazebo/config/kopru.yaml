# ros_gz_bridge ayarları: Gazebo ile ROS 2 arasındaki "tercüman".
# Gazebo kendi mesaj sistemini (gz.msgs) kullanır, ROS 2 ise kendi tiplerini.
# Köprü, her satırdaki topic'i bir taraftan alıp diğer tarafa çevirir.
#
# direction:
#   GZ_TO_ROS : Gazebo üretir, ROS okur (sensörler, odometri)
#   ROS_TO_GZ : ROS üretir, Gazebo uygular (hız komutu)

# Simülasyon saati: ROS düğümleri gerçek saat yerine Gazebo'nun saatini kullansın
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Hız komutu: klavye / davranış düğümü → Gazebo DiffDrive
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometri (sensör sayılmaz): teker dönüşlerinden tahmin edilen konum
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom → base_footprint dönüşümü (RViz'de robotun yer değiştirmesi için)
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Teker açıları (RViz'de tekerlerin dönmesi için)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
